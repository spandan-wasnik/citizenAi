[project]
name = "citizenassist-ai"
version = "0.1.0"
description = "Multilingual public service navigator for Indian citizens"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
filterwarnings = [
    "error:The default date adapter is deprecated:DeprecationWarning",
    "error:The default datetime adapter is deprecated:DeprecationWarning",
]
markers = [
    "needs_ml: needs the ML extras and downloaded models (run on the laptop)",
    "live_network: touches the real internet (run on the laptop)",
]
