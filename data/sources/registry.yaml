# Registry of source websites. A scheme file may only cite sources whose domain is listed
# here, so reuse terms and automated-access policy are decided once, per site.
#
# Values below record what was READ on 2026-10-31. "unknown" means the terms have not been
# reviewed yet; the system treats unknown as "do not automate, do not bulk copy".
#   reuse_policy:     permission_required | free_with_attribution | automated_prohibited | unknown
#   automated_access: allowed | written_permission_on_file | prohibited | unknown
#   authority_tier:   1 = official government publisher, 2 = official but secondary, 3 = other
sources:
  - domain: myscheme.gov.in
    organization: myScheme (Government of India)
    source_type: official_portal
    authority_tier: 1
    terms_url: https://www.myscheme.gov.in/terms-of-use
    reuse_policy: unknown            # terms set no separate reuse rules for site content
    automated_access: prohibited     # terms prohibit bots/scrapers without written authorization
    robots_checked_at: null          # robots.txt could not be fetched in the research session

  # pmkisan.gov.in: from the owner's Windows Python, TLS fails with 'unable to get local issuer certificate', which usually
  # means the server omits part of its certificate chain (cause not confirmed). Automated checks are therefore skipped.
  # Never disable certificate verification to work around this; links here are verified by a person in a browser.
  - domain: pmkisan.gov.in
    organization: PM-KISAN, Department of Agriculture & Farmers Welfare
    source_type: official_portal
    authority_tier: 1
    terms_url: https://pmkisan.gov.in/CopyrightPolicy.aspx
    reuse_policy: permission_required   # emailed permission first; faithful, credited, not misleading
    automated_access: unknown
    robots_checked_at: null

  - domain: pib.gov.in
    organization: Press Information Bureau
    source_type: ministry_page
    authority_tier: 1
    terms_url: https://pib.gov.in/Content/102_2_Copyright-Policy.aspx
    reuse_policy: free_with_attribution  # no prior approval; credit, faithful, third-party excluded
    automated_access: unknown
    robots_checked_at: 2026-10-31

  # Supplied by the project owner as intended sources; terms NOT yet reviewed.
# robots_checked_at 2026-10-31: robots.txt fetched from the owner's laptop; the root path was allowed for
# the CitizenAssistAI agent. india.gov.in declares Crawl-delay 10 (the checker honours it automatically).
# pmkisan.gov.in robots.txt could NOT be fetched (network error), so it is treated as do-not-fetch.
  - {domain: scholarships.gov.in, organization: National Scholarship Portal, source_type: official_portal,
     authority_tier: 1, terms_url: null, reuse_policy: unknown, automated_access: unknown, robots_checked_at: 2026-10-31}
  - {domain: mahadbt.maharashtra.gov.in, organization: MahaDBT (Government of Maharashtra), source_type: official_portal,
     authority_tier: 1, terms_url: null, reuse_policy: unknown, automated_access: unknown, robots_checked_at: 2026-10-31}
  # india.gov.in terms, pasted by the owner 2026-10-31 (terms_url still to be supplied): reproduction needs permission by
  # email first; must be accurate, not derogatory/misleading, source prominently credited, third-party material excluded.
  # Linking to its pages needs no permission, but its pages must NOT be loaded inside frames/iframes (open in a new window).
  # The policy is silent on automated access (robots.txt allows the root and asks for Crawl-delay 10).
  - {domain: india.gov.in, organization: National Portal of India, source_type: official_portal,
     authority_tier: 1, terms_url: null, reuse_policy: permission_required, automated_access: unknown, robots_checked_at: 2026-10-31}
  - {domain: maharashtra.gov.in, organization: Government of Maharashtra, source_type: official_portal,
     authority_tier: 1, terms_url: null, reuse_policy: unknown, automated_access: unknown, robots_checked_at: 2026-10-31}

  # PFRDA is the statutory pension regulator that administers the Atal Pension Yojana. Its domain is .org.in, not
  # .gov.in, so the link policy treats it as "unrecognized": links to it can be verified_manual only with
  # official_other_verified and a note. Terms and robots.txt have NOT been reviewed.
  - {domain: pfrda.org.in, organization: Pension Fund Regulatory and Development Authority, source_type: official_portal,
     authority_tier: 1, terms_url: null, reuse_policy: unknown, automated_access: unknown, robots_checked_at: null}
