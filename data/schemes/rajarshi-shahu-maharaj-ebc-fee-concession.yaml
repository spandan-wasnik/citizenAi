# Rajarshi Chhatrapati Shahu Maharaj Shikshan Shulkh Shishyavrutti Yojana (EBC/EWS fee concession), Maharashtra.
# Built ONLY from the "About Scheme", "Benefits", "Eligibility" and "Documents Required" sections of the MahaDBT scheme page
# for the Directorate of Technical Education (text pasted by the project owner from the site on 2026-11-01). An
# introductory summary that came with that paste (extra income-certificate issuer, "CAP seat allotment letter" wording,
# GR content notes, document-repository steps) was NOT used: it is not on the page. The scheme NAME is the one the owner
# chose; the pasted page text does not print it, so the name is unconfirmed by this source.
# Known limits:
#  (1) the page does not say whether applications are open this year, so status is 'unknown' and no deadline is set;
#  (2) the page cites GRs of 07 Oct 2017, 01 Mar 2018, 31 Mar 2018, 11 Jul 2019 and 08 Jul 2024; none of these GRs has
#      been read, so details like which courses count as "professional and technical" are not modelled;
#  (3) NOT modelled as rules: Indian nationality (a), course type (c), no deemed or private university (d), admission
#      through CAP (e), at most 2 children from the family (g), 50% attendance (i), no education gap of 2+ years (j);
#  (4) "Total Annual Income of Family / Guardian" is read as the family income field.
#  (5) renewal applications (previous-year income certificate and marksheet) are a different process and not modelled.
scheme_id: rajarshi-shahu-maharaj-ebc-fee-concession
level: state
state_code: MH
ministry: null
department: Higher and Technical Education Department, Maharashtra (implemented by the Directorate of Technical Education)
status: unknown
