tags: [scholarship, education, maharashtra, ebc, ews]

translations:
  en:
    official_name: Rajarshi Chhatrapati Shahu Maharaj Shikshan Shulkh Shishyavrutti Yojana (EBC/EWS fee concession)
    short_description: >-
      Financial assistance for Economically Backward Class (EBC) and Economically Weaker Section (EWS) students with
      family income up to Rs. 8 lakh, admitted through the Centralized Admission Process (CAP) to diploma, degree or
      postgraduate technical and professional courses in Maharashtra.
    benefits: >-
      Tuition fee and examination fee concession for courses of the professional type: 50% of each for male students
      and 100% of each for female students. Paid through the MahaDBT portal in two instalments into an Aadhaar-seeded
      bank account.
    target_beneficiaries: >-
      EBC and EWS students who are domiciled in Maharashtra and are bonafide students admitted through CAP to
      technical and professional courses.
    origin: curated

