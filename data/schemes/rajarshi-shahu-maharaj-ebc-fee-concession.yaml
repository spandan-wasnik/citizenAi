  - code: domicile_certificate
    requirement_type: mandatory
    names: {en: Maharashtra domicile certificate}
    source: mahadbt_page
    locator: "Documents Required, fresh application (b)"
  - code: income_certificate
    requirement_type: mandatory
    names: {en: Income certificate}
    purpose_note: The previous year's family annual income certificate.
    source: mahadbt_page
    locator: "Documents Required, fresh application (c)"
  - code: undertaking_two_beneficiaries
    requirement_type: mandatory
    names: {en: Undertaking that not more than 2 beneficiaries from your family are in the scheme this year}
    source: mahadbt_page
    locator: "Documents Required, fresh application (d)"
  - code: cap_related_document
    requirement_type: mandatory
    names: {en: CAP admission document}
    purpose_note: The page says only "CAP related document"; which paper this is has not been confirmed.
    source: mahadbt_page
    locator: "Documents Required, fresh application (e)"

