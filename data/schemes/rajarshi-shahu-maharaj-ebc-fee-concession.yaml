eligibility:
  logic: AND
  items:
    - rule: {field: domicile_state_code, op: eq, value: MH, source: mahadbt_page, locator: "Eligibility (b)"}
    - rule: {field: is_enrolled_in_education, op: is_true, source: mahadbt_page, locator: "Eligibility (c): bonafide student of the institute"}
    - rule: {field: annual_family_income, op: lte, value: 800000, source: mahadbt_page, locator: "Eligibility (h); Benefits table"}

exclusions:
  - {field: receives_other_scholarship, op: is_true, source: mahadbt_page, locator: "Eligibility (f)"}

