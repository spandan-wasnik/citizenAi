    url: https://www.maharashtra.gov.in/
    title: Government Resolution No. मबावि 2024/प्र.क्र.96/कार्या-2, 28 June 2024, Women and Child Development Department (document code 202406281814018230); the GR states it is published on this site
    doc_type: pdf
    retrieved_at: 2026-11-01
