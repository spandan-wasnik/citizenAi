# Mukhyamantri - Majhi Ladki Bahin (Maharashtra). Built ONLY from the Government Resolution of the Women and Child
# Development Department, Maharashtra, No. मबावि 2024/प्र.क्र.96/कार्या-2 dated 28 June 2024 (document code
# 202406281814018230; 9 pages, in Marathi), attached by the project owner on 2026-11-01. The Marathi text was read and
# translated by Claude; the owner reads Marathi and confirmed the reading of the age wording.
# Known limits:
#  (1) the GR says it is published on www.maharashtra.gov.in; the exact PDF address was NOT supplied, so the source
#      points at that site's home page and the GR is identified by number, date and code in its title. Replace the
#      URL with the exact address when it is known (archive.org copies were offered and are not official sources);
#  (2) the GR sets the age band as 21 completed up to 60 completed (ages 21 to 59). A LATER amendment raising the
#      ceiling to 65 is reported to the owner but no document has been read, so the upper age bound is official_only:
#      it never produces a "not met" verdict;
#  (3) the application window in para 14 (1-15 July 2024) is long past and later dates are unknown, so status is
#      'unknown' and no deadline is recorded;
#  (4) a circular of 6 Feb 2026 (code 202602061212231330) allowed a last e-KYC correction until 31 Mar 2026; it
#      changes no eligibility rule and is not cited here;
#  (5) NOT modelled as rules (para 5 and 4): family member who is a government employee or pensioner, income-tax payer,
#      current or former MP/MLA, or chair/director/member of a government board; family land of more than five acres;
#      a family four-wheeler (tractors excepted); getting more than Rs. 1,500 from another scheme (para 5(4)); and marital status
#      ("married, widowed, divorced, abandoned, destitute" does not map onto the marital-status values).
scheme_id: mukhyamantri-majhi-ladki-bahin
level: state
state_code: MH
ministry: null
department: Women and Child Development Department, Government of Maharashtra
status: unknown
volatility: volatile
verification_status: source_verified
rules_complete: false
last_verified: 2026-11-01
next_review_due: 2026-12-01
tags: [women, maharashtra, cash-transfer]

translations:
  en:
    official_name: Mukhyamantri - Majhi Ladki Bahin Yojana
    short_description: >-
      Monthly financial support for married, widowed, divorced, abandoned and destitute women of Maharashtra aged 21
      to 60, from families with annual income up to Rs. 2.5 lakh. The resolution lists several family-level
      exclusions (government employees and pensioners, income-tax payers, current or former MPs and MLAs, board
      heads, more than five acres of land, a four-wheeler); this record does not model them. A later change to the
      upper age limit has been reported but not yet read from an official document.
    benefits: >-
      Rs. 1,500 per month, paid by Direct Benefit Transfer into the woman's own Aadhaar-linked bank account. If she
      already receives less than Rs. 1,500 a month from another Central or State financial benefit scheme, the
      difference is paid.
    target_beneficiaries: >-
      Married, widowed, divorced, abandoned and destitute women of Maharashtra aged between 21 and 60 years.
    origin: curated
  mr:
    official_name: मुख्यमंत्री-माझी लाडकी बहीण योजना
    origin: official

