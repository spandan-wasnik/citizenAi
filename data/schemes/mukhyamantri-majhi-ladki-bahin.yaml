    language: mr

links: []

eligibility:
  logic: AND
  items:
    - rule: {field: gender, op: eq, value: female, source: gr_2024, locator: "paras 3 and 4(1)"}
    - rule: {field: state_code, op: eq, value: MH, source: gr_2024, locator: "para 4(1)"}
    - rule: {field: age_years, op: gte, value: 21, source: gr_2024, locator: "para 4(3)"}
    - rule: {field: age_years, op: lte, value: 59, evaluability: official_only, source: gr_2024, locator: "para 4(3); a later amendment is reported but not read"}
    - rule: {field: annual_family_income, op: lte, value: 250000, source: gr_2024, locator: "paras 4(5) and 5(1)"}
    - rule: {field: has_bank_account, op: is_true, source: gr_2024, locator: "para 4(4)"}

documents:
  - code: aadhaar
    requirement_type: mandatory
    names: {en: Aadhaar number}
    purpose_note: The benefit goes into an Aadhaar-linked bank account, and e-KYC is done with your own Aadhaar.
    source: gr_2024
    locator: "paras 6(2), 9(अ)(5) and 9(ई)"
  - code: domicile_certificate
    requirement_type: mandatory
    names: {en: Maharashtra domicile certificate}
    purpose_note: The GR also accepts a birth certificate issued in Maharashtra.
    source: gr_2024
    locator: "para 6(3)"
  - code: income_certificate
    requirement_type: mandatory
    names: {en: Income certificate}
    purpose_note: The family head's income certificate from the competent authority, showing annual income up to Rs. 2.5 lakh.
    source: gr_2024
    locator: "para 6(4)"
  - code: bank_account_details
    requirement_type: mandatory
    names: {en: Bank account number and IFSC code}
    purpose_note: A photocopy of the first page of the passbook. The account must be Aadhaar-linked and Direct Benefit Transfer enabled.
    source: gr_2024
    locator: "paras 2, 6(5) and 9(ई)"
  - code: passport_photograph
    requirement_type: mandatory
    names: {en: Passport-size photograph}
    source: gr_2024
    locator: "para 6(6)"
  - code: ration_card
    requirement_type: mandatory
    names: {en: Ration card}
    purpose_note: Also needed in person for e-KYC, as the family's full identity document.
    source: gr_2024
    locator: "paras 6(7) and 9(अ)(5)"
  - code: undertaking_scheme_conditions
    requirement_type: mandatory
    names: {en: Undertaking that you comply with the scheme's conditions}
    source: gr_2024
    locator: "para 6(8)"

steps:
  en:
    - instruction: Apply online on the scheme's portal or mobile app, or at a Setu Suvidha Kendra. If you cannot apply online, the form is available at the Anganwadi centre, the Child Development Project Officer's office, the Gram Panchayat or the ward office, where staff enter it online for you. The whole process is free.
      source: gr_2024
      locator: "para 9(अ)(1)-(4)"
    - instruction: Be present in person at that place so that your photo can be taken directly and e-KYC done. Bring your family's ration card and your own Aadhaar card.
      source: gr_2024
      locator: "para 9(अ)(5)"
    - instruction: A provisional list of applicants is published on the portal and app and put on notice boards at the Anganwadi, Gram Panchayat and ward level. Any objection or complaint must be recorded within 5 days of the list being published.
      source: gr_2024
      locator: "paras 9(ब) and 9(क)"
    - instruction: A final list of eligible and ineligible applicants is published. The money is paid into your own Aadhaar-linked, Direct Benefit Transfer enabled bank account through the District Women and Child Development Officer's office.
      source: gr_2024
      locator: "paras 9(ड) and 9(ई)"

other_conditions:
  - kind: requirement
    text: {en: "The scheme is for married, widowed, divorced, abandoned and destitute women of Maharashtra."}
    source: gr_2024
    locator: "paras 3 and 4(2)"
  - kind: exclusion
    text: {en: "Not eligible if any family member is a regular, permanent or contract employee of a government department, undertaking, board or local body of the Central or State Government, or a retired pensioner. Workers engaged through an outside agency and voluntary workers are not excluded."}
    source: gr_2024
    locator: "para 5(3)"
  - kind: exclusion
    text: {en: "Not eligible if any family member is an income-tax payer."}
    source: gr_2024
    locator: "para 5(2)"
  - kind: exclusion
    text: {en: "Not eligible if any family member is a present or former Member of Parliament or of the Legislative Assembly."}
    source: gr_2024
    locator: "para 5(5)"
  - kind: exclusion
    text: {en: "Not eligible if any family member is a chairperson, vice-chairperson, director or member of a board, corporation or undertaking of the Central or State Government."}
    source: gr_2024
    locator: "para 5(6)"
  - kind: exclusion
    text: {en: "Not eligible if family members jointly own more than five acres of agricultural land."}
    source: gr_2024
    locator: "para 5(7)"
  - kind: exclusion
    text: {en: "Not eligible if a four-wheeler (tractors excepted) is registered in the name of a family member."}
    source: gr_2024
    locator: "para 5(8)"
  - kind: exclusion
    text: {en: "Not eligible if you already get more than Rs. 1,500 a month from financial schemes of other government departments. If you get less than Rs. 1,500, the difference is paid."}
    source: gr_2024
    locator: "paras 2 and 5(4)"
